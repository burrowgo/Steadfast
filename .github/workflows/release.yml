name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ github.event.inputs.version_name }}"
            TAG_NAME="v${RAW_VERSION#v}"
            CLEAN_VERSION="${RAW_VERSION#v}"
          else
            TAG_NAME="${{ github.ref_name }}"
            CLEAN_VERSION="${TAG_NAME#v}"
          fi
          
          # Use run_number for a monotonic, strictly increasing Android versionCode
          VERSION_CODE="${{ github.run_number }}"

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "VERSION_NAME=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

          echo "Building release for tag: $TAG_NAME (Version: $CLEAN_VERSION, Code: $VERSION_CODE)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret detected, decoding..."
            mkdir -p ${{ runner.temp }}/keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > ${{ runner.temp }}/keystore/release.keystore
            echo "KEYSTORE_FILE=${{ runner.temp }}/keystore/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No custom keystore provided in secrets; using repository fallback keystore."
            echo "KEYSTORE_FILE=${{ github.workspace }}/app/debug.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Run Tests & Lint
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Build Release & Debug Artifacts
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: ./gradlew assembleRelease assembleDebug bundleRelease

      - name: Package & Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts

          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_AAB="app/build/outputs/bundle/release/app-release.aab"

          DEST_RELEASE_APK="release-artifacts/steadfast-${{ env.TAG_NAME }}-release.apk"
          DEST_DEBUG_APK="release-artifacts/steadfast-${{ env.TAG_NAME }}-debug.apk"
          DEST_RELEASE_AAB="release-artifacts/steadfast-${{ env.TAG_NAME }}-release.aab"

          cp "$RELEASE_APK" "$DEST_RELEASE_APK"
          cp "$DEBUG_APK" "$DEST_DEBUG_APK"
          cp "$RELEASE_AAB" "$DEST_RELEASE_AAB"

          cd release-artifacts
          sha256sum "steadfast-${{ env.TAG_NAME }}-release.apk" > "steadfast-${{ env.TAG_NAME }}-release.apk.sha256"
          sha256sum "steadfast-${{ env.TAG_NAME }}-debug.apk" > "steadfast-${{ env.TAG_NAME }}-debug.apk.sha256"
          sha256sum "steadfast-${{ env.TAG_NAME }}-release.aab" > "steadfast-${{ env.TAG_NAME }}-release.aab.sha256"
          sha256sum steadfast-${{ env.TAG_NAME }}-* > checksums.txt
          cd ..

          echo "Prepared artifacts:"
          ls -lh release-artifacts/

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          if [ -f CHANGELOG.md ]; then
            python3 -c '
          import re, sys
          tag = sys.argv[1].lstrip("v")
          try:
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  content = f.read()
              pattern = rf"## \[?{re.escape(tag)}\]?.*?(?=(?:\n## \[|\Z))"
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(0).strip()
                  notes = re.sub(r"\n+---+\s*$", "", notes).strip()
                  with open("release_notes.md", "w", encoding="utf-8") as out:
                      out.write(notes + "\n")
                  print("Extracted release notes for " + tag)
              else:
                  print("No release notes found for " + tag)
          except Exception as e:
              print("Error extracting release notes:", e)
          ' "${{ env.TAG_NAME }}"
          fi
          if [ ! -s release_notes.md ]; then
            echo "Steadfast ${{ env.TAG_NAME }}" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Steadfast ${{ env.TAG_NAME }}"
          draft: false
          prerelease: ${{ contains(env.TAG_NAME, 'alpha') || contains(env.TAG_NAME, 'beta') || contains(env.TAG_NAME, 'rc') || github.event.inputs.prerelease == 'true' || github.event.inputs.prerelease == true }}
          body_path: release_notes.md
          files: |
            release-artifacts/steadfast-${{ env.TAG_NAME }}-release.apk
            release-artifacts/steadfast-${{ env.TAG_NAME }}-debug.apk
            release-artifacts/steadfast-${{ env.TAG_NAME }}-release.aab
            release-artifacts/steadfast-${{ env.TAG_NAME }}-release.apk.sha256
            release-artifacts/steadfast-${{ env.TAG_NAME }}-debug.apk.sha256
            release-artifacts/steadfast-${{ env.TAG_NAME }}-release.aab.sha256
            release-artifacts/checksums.txt
