name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ github.event.inputs.version_name }}"
            TAG_NAME="v${RAW_VERSION#v}"
            CLEAN_VERSION="${RAW_VERSION#v}"
          else
            TAG_NAME="${{ github.ref_name }}"
            CLEAN_VERSION="${TAG_NAME#v}"
          fi
          
          # Use run_number for a monotonic, strictly increasing Android versionCode
          VERSION_CODE="${{ github.run_number }}"

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "VERSION_NAME=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

          echo "Building release for tag: $TAG_NAME (Version: $CLEAN_VERSION, Code: $VERSION_CODE)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret detected, decoding..."
            mkdir -p ${{ runner.temp }}/keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > ${{ runner.temp }}/keystore/release.keystore
            echo "KEYSTORE_FILE=${{ runner.temp }}/keystore/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No custom keystore provided in secrets; build will use fallback signature."
          fi

      - name: Run Tests & Lint
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Build Release APK & AAB
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Package & Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          AAB_SRC="app/build/outputs/bundle/release/app-release.aab"
          
          APK_DEST="release-artifacts/steadfast-${{ env.TAG_NAME }}.apk"
          AAB_DEST="release-artifacts/steadfast-${{ env.TAG_NAME }}.aab"

          cp "$APK_SRC" "$APK_DEST"
          cp "$AAB_SRC" "$AAB_DEST"

          cd release-artifacts
          sha256sum "steadfast-${{ env.TAG_NAME }}.apk" > "steadfast-${{ env.TAG_NAME }}.apk.sha256"
          sha256sum "steadfast-${{ env.TAG_NAME }}.aab" > "steadfast-${{ env.TAG_NAME }}.aab.sha256"
          cd ..

          ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Steadfast ${{ env.TAG_NAME }}"
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-artifacts/steadfast-${{ env.TAG_NAME }}.apk
            release-artifacts/steadfast-${{ env.TAG_NAME }}.aab
            release-artifacts/steadfast-${{ env.TAG_NAME }}.apk.sha256
            release-artifacts/steadfast-${{ env.TAG_NAME }}.aab.sha256
